name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node.js that package.json "engines" accepts, exactly (22 alone would get the
        # newest 22.x), then the current releases. Windows is the main platform users run on.
        os: [ubuntu-latest]
        node: ['22.12', 24, 26]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Unit tests, with coverage thresholds (.c8rc.json)
        run: npm test

      - name: Server and engine smoke test
        run: npm run test:smoke

  check:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: TypeScript (every file)
        run: npm run typecheck

  e2e:
    name: Browser tests (Chromium, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests, then a coverage report of the browser code (no threshold)
        run: npm run test:e2e:coverage

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  hygiene:
    name: Secrets and repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No personal data or engine binaries are tracked
        run: |
          bad=$(git ls-files -- data/ 'engine/*' ':!engine/README.txt' '*.env' '.env.*')
          if [ -n "$bad" ]; then
            echo "::error::These files must not be committed (see .gitignore):"
            echo "$bad"
            exit 1
          fi

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
