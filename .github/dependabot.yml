# Weekly update PRs for npm packages and GitHub Actions. CI (unit, smoke and
# browser tests) decides whether an update is safe to merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases settle for two weeks before proposing them.
    cooldown:
      default-days: 14
    groups:
      # Test tooling moves together; app dependencies get a PR each.
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
