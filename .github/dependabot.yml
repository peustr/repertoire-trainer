# Weekly update PRs for npm packages and GitHub Actions. CI (unit, smoke and
# browser tests) decides whether an update is safe to merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases settle for two weeks before proposing them.
    cooldown:
      default-days: 14
    groups:
      # Test tooling moves together; app dependencies get a PR each.
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 is the native rewrite, and typescript-eslint (the type-aware lint
      # rules) supports only TypeScript below 6.1 so far, so npm ci fails with it.
      # Remove this once typescript-eslint's peer range includes 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types for the oldest Node.js we support (engines in package.json), so the type
      # check rejects APIs that only newer Node versions have. Move it up with engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
